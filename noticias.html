<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notícias | Anchor</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="img/logo-anchor.png"
    >

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="noticias.css">
</head>

<body>

<!-- ========================= -->
<!-- HEADER 2 -->
<!-- ========================= -->

<header class="header-interno">

    <!-- LOGO -->
    <div class="logo">
        <a href="index.html">
            <img
                src="img/logo-anchor.png"
                alt="Logo Anchor"
            >
        </a>
    </div>

    <!-- MENU PRINCIPAL -->
    <nav class="menu-principal">

        <a href="index.html">
            Home
        </a>

        <a href="denuncia.html">
            Fazer denúncia
        </a>

        <a href="acompanhar.html">
            Acompanhar denúncia
        </a>

        <a href="ajuda-psicologica.html">
            Ajuda Psicológica
        </a>

        <a href="informacoes.html">
            Informações
        </a>

        <a
            href="noticias.html"
            class="pagina-ativa"
        >
            Notícias
        </a>

        <a href="tipos-denuncia.html">
            Tipos de denúncia
        </a>

        <a href="sobre.html">
            Sobre
        </a>

        <a href="contato.html">
            Contato
        </a>

    </nav>

</header>

<!-- =========================================================
     CONTEÚDO PRINCIPAL
========================================================== -->

<main>

    <!-- =====================================================
         CABEÇALHO DAS NOTÍCIAS
    ====================================================== -->

    <section
        class="cabecalho-noticias"
        id="catalogoNoticias"
    >

        <span class="pequeno-titulo">
            FIQUE POR DENTRO
        </span>

        <h1>
            Notícias
        </h1>

        <p>
            Informação sobre direitos, segurança, saúde,
            prevenção e outros temas importantes.
        </p>

    </section>


    <!-- =====================================================
         CATEGORIAS
    ====================================================== -->

    <section
        class="categorias"
        id="categorias"
    >

        <button
            class="categoria-btn ativa"
            data-categoria="todas"
        >
            Todas
        </button>

        <button
            class="categoria-btn"
            data-categoria="direitos"
        >
            Direitos
        </button>

        <button
            class="categoria-btn"
            data-categoria="conscientizacao"
        >
            Conscientização
        </button>

        <button
            class="categoria-btn"
            data-categoria="seguranca"
        >
            Segurança
        </button>

        <button
            class="categoria-btn"
            data-categoria="saude"
        >
            Saúde
        </button>

        <button
            class="categoria-btn"
            data-categoria="digital"
        >
            Digital
        </button>

        <button
            class="categoria-btn"
            data-categoria="educacao"
        >
            Educação
        </button>

    </section>


    <!-- =====================================================
         CARROSSEL
    ====================================================== -->

    <section
        class="area-carrossel"
        id="areaCarrossel"
    >

        <!-- SETA ESQUERDA -->
        <button
            class="seta-carrossel esquerda"
            id="btnAnterior"
            type="button"
            aria-label="Notícia anterior"
        >

            <i class="fa-solid fa-chevron-left"></i>

        </button>


        <!-- CARDS GERADOS PELO JS -->
        <div
            class="carrossel"
            id="carrossel"
        >
        </div>


        <!-- SETA DIREITA -->
        <button
            class="seta-carrossel direita"
            id="btnProxima"
            type="button"
            aria-label="Próxima notícia"
        >

            <i class="fa-solid fa-chevron-right"></i>

        </button>

    </section>


    <!-- =====================================================
         INDICADORES
    ====================================================== -->

    <div
        class="indicadores"
        id="indicadores"
    >
    </div>


    <!-- =====================================================
         MATÉRIA COMPLETA
    ====================================================== -->

    <section
        class="materia-completa"
        id="materiaCompleta"
    >

        <button
            class="btn-voltar"
            id="btnVoltar"
            type="button"
        >
            ← Voltar para notícias
        </button>

        <div id="conteudoMateria"></div>

    </section>

</main>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="noticias.js"></script>

</body>

</html>
